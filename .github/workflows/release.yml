name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

  ci:
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-indicator-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Desktop Indicator ${{ github.ref_name }}" \
            --generate-notes --verify-tag $prerelease
