# Categories for GitHub's automatically generated release notes.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New features
      labels: [feature, enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Look & feel
      labels: [ui]
    - title: Virtual desktops
      labels: [desktops]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation
      labels: [documentation]
    - title: Build & CI
      labels: [ci]
    - title: Other changes
      labels: ["*"]
